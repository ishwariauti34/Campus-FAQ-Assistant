
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus FAQ Assistant</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Campus FAQ Assistant</h1>

        <p>Your smart college information assistant</p>

        <div class="chat-header">
            <span>Chat with Campus Assistant</span>
            <button id="clear-btn" type="button">Clear Chat</button>
        </div>

        <div class="chat-box" id="chat-box">

            <div class="bot-message">

                <strong class="message-sender">Campus Assistant</strong>

                <div>
                    Hello! Welcome to Campus FAQ Assistant.
                    Ask me anything about your college!
                </div>

                <small class="message-time">Welcome</small>

            </div>

        </div>

        <div class="suggestions">

            <h3>Suggested Questions</h3>

            <button class="suggestion-btn" data-question="How can I apply for admission?">
                Admission
            </button>

            <button class="suggestion-btn" data-question="How can I pay my fees?">
                Fees
            </button>

            <button class="suggestion-btn" data-question="What are the library timings?">
                Library
            </button>

            <button class="suggestion-btn" data-question="How can I check my attendance?">
                Attendance
            </button>

            <button class="suggestion-btn" data-question="Does the college provide placements?">
                Placements
            </button>

            <button class="suggestion-btn" data-question="Is hostel accommodation available?">
                Hostel
            </button>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type your question here..."
            >

            <button id="send-btn" type="button">Send</button>

        </div>

    </div>


    <script>

        const input = document.getElementById("user-input");

        const sendBtn = document.getElementById("send-btn");

        const chatBox = document.getElementById("chat-box");

        const clearBtn = document.getElementById("clear-btn");


        // Display messages with sender names and timestamps

        function addMessage(message, className) {

            const messageDiv = document.createElement("div");

            messageDiv.className = className;

            const sender = document.createElement("strong");

            sender.className = "message-sender";

            sender.textContent = className === "user-message"
                ? "You"
                : "Campus Assistant";

            const messageText = document.createElement("div");

            messageText.textContent = message;

            const time = document.createElement("small");

            time.className = "message-time";

            time.textContent = new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });

            messageDiv.appendChild(sender);

            messageDiv.appendChild(messageText);

            messageDiv.appendChild(time);

            chatBox.appendChild(messageDiv);

            chatBox.scrollTop = chatBox.scrollHeight;

        }


        // Send question to Python backend

        async function sendMessage() {

            const question = input.value.trim();

            if (question === "") {
                return;
            }

            addMessage(question, "user-message");

            input.value = "";

            sendBtn.disabled = true;

            try {

                const response = await fetch("/ask", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })

                });

                if (!response.ok) {
                    throw new Error("Server error");
                }

                const data = await response.json();

                addMessage(data.answer, "bot-message");

            }

            catch (error) {

                addMessage(
                    "Something went wrong. Please try again.",
                    "bot-message"
                );

            }

            finally {

                sendBtn.disabled = false;

                input.focus();

            }

        }


        // Send button functionality

        sendBtn.addEventListener("click", sendMessage);


        // Send message using Enter key

        input.addEventListener("keypress", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });


        // Suggested questions functionality

        const suggestionButtons = document.querySelectorAll(".suggestion-btn");

        suggestionButtons.forEach(function(button) {

            button.addEventListener("click", function() {

                input.value = button.dataset.question;

                sendMessage();

            });

        });


        // Clear chat functionality

        clearBtn.addEventListener("click", function() {

            chatBox.innerHTML = "";

            addMessage(
                "Hello! Welcome to Campus FAQ Assistant. Ask me anything about your college!",
                "bot-message"
            );

        });

    </script>

</body>

</html>
